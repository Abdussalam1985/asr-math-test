:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f0f2f5;--card:#fff;--tx:#222;--mut:#5f6368;--pri:#1a73e8;--bd:#e0e0e0;--ok:#e8f5e9;--no:#ffebee;--sub:#e8f0fe}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14171c;--card:#1e2229;--tx:#eceff4;--mut:#a0a7b4;--pri:#6ea8fe;--bd:#363c46;--ok:#1b3a24;--no:#41202a;--sub:#22304a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'SolaimanLipi','Noto Sans Bengali',Arial,sans-serif;background:var(--bg);color:var(--tx);margin:0;padding:16px}
.c{max-width:800px;margin:0 auto;background:var(--card);padding:24px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.12)}
h1,h2{text-align:center;color:var(--pri);margin:4px 0}h1{font-size:26px}h2{font-size:18px}
.sub{text-align:center;color:var(--mut);margin-bottom:16px;font-size:14px}
input{width:100%;padding:11px;margin:6px 0;border:1px solid var(--bd);border-radius:6px;font-size:16px;background:var(--card);color:var(--tx);box-sizing:border-box}
button,.btn{background:var(--pri);color:#fff;border:0;padding:12px 26px;font-size:17px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block;margin:4px;font-family:inherit}
button:disabled{opacity:.5}.sec{background:var(--mut)}.wa{background:#25D366}.fb{background:#4267B2}

.q{border:1px solid var(--bd);padding:14px;border-radius:8px;margin-bottom:14px}
.qt{font-weight:bold;margin-bottom:10px}
.q label{display:block;padding:8px 10px;margin-bottom:5px;border:1px solid var(--bd);border-radius:5px;cursor:pointer}
.q label:hover{border-color:var(--pri)}.q input{width:auto;margin-right:8px}
.ok{background:var(--ok);border-color:#4caf50}.no{background:var(--no);border-color:#f44336}
.ex{margin-top:8px;padding:8px 10px;background:var(--sub);border-radius:6px;font-size:15px}
.res{text-align:center;font-size:20px;font-weight:bold;padding:16px;border-radius:8px;background:var(--sub)}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{border-bottom:1px solid var(--bd);padding:7px;text-align:left}
.tabs{text-align:center}.hide{display:none}.note{font-size:13px;color:var(--mut);text-align:center}
body{background:linear-gradient(160deg,#dff5e9,#e3ecff 50%,#fff0d9)}

h1{color:#0b8f5a}h2{color:#e65100}
button,.btn{background:linear-gradient(135deg,#0b8f5a,#1a73e8);box-shadow:0 3px 8px rgba(0,0,0,.25)}
button.sec{background:linear-gradient(135deg,#8e24aa,#e91e63)}.btn.wa{background:linear-gradient(135deg,#25D366,#128C7E)}.btn.fb{background:linear-gradient(135deg,#4267B2,#2d4a8a)}
#timer{background:linear-gradient(90deg,#ff9800,#f4511e);color:#fff;border:0;box-shadow:0 3px 8px rgba(244,81,30,.4)}

.q.ok{background:var(--ok);border-color:#4caf50}.q.no{background:var(--no);border-color:#f44336}
.q label:hover{background:rgba(26,115,232,.12)}.q label:has(input:checked){background:rgba(255,193,7,.28);border-color:#f9a825;font-weight:bold}

.ex{border-left:4px solid #1a73e8}
th{background:#0b8f5a;color:#fff}
